name: Refresh upcoming predictions

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upcoming-predictions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'keammakola/Football-Predictor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          test -n "$ODDS_API_KEY" || { echo 'Missing ODDS_API_KEY repository secret'; exit 1; }
          test -n "$VERCEL_DEPLOY_HOOK" || { echo 'Missing VERCEL_DEPLOY_HOOK repository secret'; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify data safeguards
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh results, observed xG, fixtures and odds
        run: python refresh_predictions.py
      - name: Publish upcoming snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data/upcoming.json frontend/public/data/upcoming-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh upcoming prediction snapshot'
          # Remove temporary training inputs before rebasing onto concurrent edits.
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request Vercel deployment
        # Run even if the snapshot is unchanged, so a failed deploy can be retried.
        run: curl --fail --silent --output /dev/null --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK"
